name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned for the zigbuild jobs (musl-x86_64/aarch64, macos-universal).
  # Must match a real ziglang.org artifact; 0.15+ uses <arch>-<os> tarball order.
  ZIG_VERSION: 0.16.0

jobs:
  # Portable static Linux/x86_64 — zigbuild + zig-built libpcap (same path
  # as aarch64). The previous musl-gcc job regressed in 0.1.18 after dropping
  # the kernel-header symlinks / --with-pcap=linux that native musl needs.
  build-musl-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target / cross libpcap
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cache/sipmon/pcap-zig
          key: musl-x86_64-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-zig${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make flex bison autoconf automake libtool \
            git curl xz-utils

      - name: Install zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: make musl-x86_64

      - name: Verify fully static
        run: |
          file target/x86_64-unknown-linux-musl/release/sipmon
          file target/x86_64-unknown-linux-musl/release/sipmon | grep -q \
            "statically linked" \
            || { echo "ERROR: binary is not fully static"; exit 1; }

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          cp sipmon sipmon-x86_64-unknown-linux-musl
          sha256sum sipmon-x86_64-unknown-linux-musl \
            > sipmon-x86_64-unknown-linux-musl.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/sipmon-x86_64-unknown-linux-musl
            target/x86_64-unknown-linux-musl/release/sipmon-x86_64-unknown-linux-musl.sha256

  # Portable static Linux/ARM64 — cross-compiled with zig (no aarch64
  # toolchain or qemu needed on the x86_64 runner). The Makefile builds the
  # cross libpcap (cached under ~/.cache/sipmon/pcap-zig, with a github
  # clone + autoreconf fallback when tcpdump.org is unreachable) and links
  # via cargo-zigbuild.
  build-musl-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target / cross libpcap
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cache/sipmon/pcap-zig
          key: musl-aarch64-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-zig${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make flex bison autoconf automake libtool \
            git curl xz-utils

      - name: Install zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: make musl-aarch64

      - name: Verify fully static
        run: |
          file target/aarch64-unknown-linux-musl/release/sipmon
          file target/aarch64-unknown-linux-musl/release/sipmon | grep -q \
            "statically linked" \
            || { echo "ERROR: binary is not fully static"; exit 1; }

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-musl/release
          cp sipmon sipmon-aarch64-unknown-linux-musl
          sha256sum sipmon-aarch64-unknown-linux-musl \
            > sipmon-aarch64-unknown-linux-musl.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/aarch64-unknown-linux-musl/release/sipmon-aarch64-unknown-linux-musl
            target/aarch64-unknown-linux-musl/release/sipmon-aarch64-unknown-linux-musl.sha256

  # macOS universal2 (x86_64 + arm64) — zig as the linker, SDK libpcap.
  build-macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: macos-universal-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-zig${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: make macos-universal

      - name: Verify universal2
        run: |
          file target/universal2-apple-darwin/release/sipmon
          file target/universal2-apple-darwin/release/sipmon | grep -q \
            "2 architectures" \
            || { echo "ERROR: binary is not universal2"; exit 1; }

      - name: Package
        run: |
          cd target/universal2-apple-darwin/release
          cp sipmon sipmon-universal2-apple-darwin
          # Ad-hoc signature: arm64 slices refuse to run unsigned once the
          # binary carries a quarantine attribute (e.g. downloaded from the
          # release page).
          codesign --force --sign - sipmon-universal2-apple-darwin
          shasum -a 256 sipmon-universal2-apple-darwin \
            > sipmon-universal2-apple-darwin.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/universal2-apple-darwin/release/sipmon-universal2-apple-darwin
            target/universal2-apple-darwin/release/sipmon-universal2-apple-darwin.sha256
