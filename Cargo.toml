[package]
name = "sipmon"
version = "0.1.17"
edition = "2024"
description = "Passive SIP/RTP signaling & media quality monitoring (pcap/live, TUI + JSONL export)"
license = "MIT"
authors = ["sipmon"]
repository = "https://github.com/miuda-ai/sipmon"
documentation = "https://docs.rs/sipmon"
keywords = ["sip", "rtp", "monitoring", "pcap", "voip"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "sipmon"
path = "src/main.rs"

[dependencies]
# CLI / runtime
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
# data
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# faster hashing for hot-path maps (Registry / Correlator / ipstats / heatmap)
rustc-hash = "2"
# inline storage for small indices (e.g. ssrc_index entries, almost always <=2)
smallvec = "1"
# decode
etherparse = "0.16"
# SIP parsing (parser + message model only; no network stack)
rsipstack = "0.6.4"
# capture
pcap = "2.5"
# daemonization / signal handling (record -d)
libc = "0.2"
# TUI
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
